apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aukro-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aukro-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/aukro-service
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/aukro-service
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/aukro-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/aukro-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/aukro-service
        property: PAYMENT_WEBHOOK_API_KEY

    # Inbound guard for the marketing-microservice -> aukro-service order-affinity
    # replay lane (orders.controller.ts assertMarketingService). Its own opaque
    # secret, NOT JWT_TOKEN: that property held the shared a2880693 value, which
    # was simultaneously the credential for five other services. marketing reads
    # this same property as ORDER_AFFINITY_AUKRO_REPLAY_TOKEN, so one Vault write
    # moves both sides of the lane at once.
    - secretKey: AUKRO_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/aukro-service
        property: MARKETING_REPLAY_TOKEN
    # Per-pair RS256 principal for the aukro-service -> orders-microservice lane.
    # Its own Vault property, NOT JWT_TOKEN: that property is the shared a2880693
    # value and also feeds AUKRO_INTERNAL_SERVICE_TOKEN above.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/aukro-service
        property: ORDERS_SERVICE_TOKEN
    # Per-pair RS256 principal for the aukro-service -> catalog-microservice lane.
    # Its own Vault property, NOT JWT_TOKEN: that property is the shared a2880693
    # value, which catalog rejects — the reason this lane returned 401.
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/aukro-service
        property: CATALOG_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: AUKRO_WAREHOUSE_SERVICE_TOKEN
